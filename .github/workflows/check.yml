name: check

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type (mypy)
        run: mypy core memory funnel llm_bridge orchestrator
      - name: Test (pytest)
        run: python -m pytest -q