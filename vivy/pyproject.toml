[project]
name = "vivy-core"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-benchmark>=4",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["core*", "funnel*", "llm_bridge*", "memory*", "orchestrator*", "benchmarks*",
           "engine*", "integration*", "training*", "forager*", "local_department*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "training"]
addopts = "--basetemp=_pytest_tmp"
# [ADDED 29/09/2026 · WP-4 / T10] src/ was never on sys.path, so every test of
# the trading line (`vivy.hands`, `vivy.core`, `vivy.api`) died at import and
# sat behind tests/unit/conftest.py's collect_ignore_glob.  RiskGate cannot be
# accepted on "60 adversarial orders → 0 leak" if the gate is untestable.
# `src/` holds only the `vivy.*` and `nps_core.*` packages, so this cannot
# collide with the top-level health-stack packages (core/, engine/, memory/…).
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true