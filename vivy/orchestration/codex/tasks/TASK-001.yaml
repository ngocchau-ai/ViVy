task_contract:
  task_id: TASK-001
  title: "Foundation Freeze"
  objective:
    problem: >
      Repository hiện chỉ là context package, chưa có Git history, executable
      schemas, production skeleton hoặc codegraph indexer.
    expected_outcome: >
      Khởi tạo nền tảng Python tối thiểu có thể kiểm thử cho NPS Core, khóa
      bốn contract V1 và cung cấp codegraph indexer deterministic đồng bộ với
      repository HEAD.
    non_goals:
      - "Không xây deterministic reasoning runtime."
      - "Không tích hợp LLM/model inference vào production code."
      - "Không triển khai adaptive N, tribunal hoặc executor router."
      - "Không thay đổi NPS Core V1 architecture baseline."
  context:
    architecture_refs:
      - "ARCHITECTURE.md#12-repository-de-xuat"
      - "ARCHITECTURE.md#13-cac-data-contract-chinh"
      - "ARCHITECTURE.md#16-giai-doan-0-foundation-freeze"
      - "ARCHITECTURE.md#20-workflow-chuan-cho-moi-task-code"
    codegraph_nodes: []
    relevant_files:
      - "memory/00-identity/non-negotiables.md"
      - "memory/01-architecture/module-map.md"
      - "memory/03-codegraph/codegraph.json"
      - "memory/03-codegraph/codegraph-summary.md"
      - "schemas/README.md"
    prior_decisions:
      - "memory/02-decisions/ADR-0001-architecture-baseline.md"
      - "memory/02-decisions/ADR-0002-codex-local-boundary.md"
      - "memory/02-decisions/ADR-0003-memory-codegraph.md"
  constraints:
    language: "Python 3.11+"
    dependencies_allowed:
      - "Python standard library"
      - "pytest as development/test dependency"
      - "jsonschema as development/test dependency"
    dependencies_forbidden:
      - "Runtime network calls"
      - "Hosted model SDKs"
      - "Databases"
      - "Frameworks not required by Foundation Freeze"
    performance_budget:
      codegraph_small_repository_seconds: 5
    security_requirements:
      - "Indexer must not execute indexed source files."
      - "Indexer must not follow symlinks outside repository root."
      - "All output paths must resolve inside the selected repository root."
    compatibility_requirements:
      - "Windows PowerShell"
      - "Linux shell"
      - "UTF-8 repository content"
  implementation:
    assigned_role: local_coder
    allowed_files:
      - ".gitignore"
      - "README.md"
      - "CONTRIBUTING.md"
      - "pyproject.toml"
      - "uv.lock"
      - "schemas/**"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "memory/02-decisions/ADR-0004-python-foundation.md"
      - "memory/02-decisions/index.md"
      - "memory/03-codegraph/**"
      - "memory/04-tasks/**"
      - "memory/05-evidence/TASK-001/**"
      - "memory/07-sessions/**"
      - "local_department/model_profiles/**"
      - "local_department/routing/**"
      - "orchestration/codex/tasks/TASK-001.yaml"
    forbidden_files:
      - "ARCHITECTURE.md"
      - "raw/**"
      - "memory/00-identity/**"
      - "memory/02-decisions/ADR-0001-architecture-baseline.md"
      - "memory/02-decisions/ADR-0002-codex-local-boundary.md"
      - "memory/02-decisions/ADR-0003-memory-codegraph.md"
    expected_artifacts:
      - "Python src-layout repository skeleton for every V1 module."
      - "Reproducible development dependency lock generated by uv."
      - "Four Draft 2020-12 schemas: ThoughtState, EvidencePacket, TaskContract, ExperimentContract."
      - "Minimal Python AST codegraph indexer and refresh CLI."
      - "Codegraph specification and generated summary."
      - "ADR-0004 recording the Python 3.11 foundation decision."
      - "Automated schema, indexer, architecture and CLI tests."
  validation:
    acceptance_criteria:
      - "Repository is a valid Git repository with at least one commit."
      - "pyproject.toml defines an installable nps-core package using src layout."
      - "All V1 architecture modules exist as importable Python packages."
      - "Each of the four JSON schemas is valid Draft 2020-12 JSON Schema."
      - "Valid canonical examples pass and intentionally invalid examples fail every schema."
      - "Indexer deterministically extracts Python module/symbol/import nodes and edges without importing target code."
      - "Indexer excludes .git, caches, virtual environments and configured generated output."
      - "Refresh command writes codegraph metadata containing the exact current Git HEAD."
      - "Codegraph summary documents freshness and node/edge counts."
      - "All automated tests pass from a clean checkout."
      - "No production dependency beyond Python standard library."
      - "Architecture drift checklist has no unresolved violation."
    required_tests:
      - "Schema meta-validation and positive/negative fixtures."
      - "AST indexer unit tests for functions, classes and imports."
      - "Determinism test: identical tree produces byte-identical graph except explicitly normalized metadata."
      - "Path safety and excluded-directory tests."
      - "CLI integration test in a temporary Git repository."
      - "Architecture skeleton import test."
    regression_checks:
      - "Existing context and identity documents remain byte-unchanged outside allowed files."
      - "git status contains no unexpected generated caches."
    evidence_schema: evidence_packet_v1
  token_budget:
    max_context_tokens: 12000
    max_output_tokens: 6000
    required_summary_mode: diff_first
  completion:
    status: completed
    reviewer: local_reviewer
    codegraph_refresh_required: true
    memory_update_required: true
