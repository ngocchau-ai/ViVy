task_contract:
  task_id: TASK-008
  title: "Incremental Codegraph Indexer, Context Retrieval Capsule, and Token-Efficient Cache"
  objective:
    problem: >
      Stage 3 requires incremental AST codegraph indexing, token-budgeted context retrieval capsules,
      and token-efficient context caching to reduce LLM prompt size without sacrificing reasoning accuracy.
    expected_outcome: >
      An incremental codegraph indexer, ContextCapsule retriever, and ContextCache module within
      nps_core.codegraph, backed by unit tests and a token reduction benchmark.
    non_goals:
      - "Do not alter Stage 0-2 frozen APIs."
      - "Do not implement Adaptive N or Student training."
  constraints:
    language: "Python 3.11+"
    dependencies_allowed:
      - "Python standard library"
    dependencies_forbidden:
      - "New production dependencies"
  implementation:
    assigned_role: local_coder
    allowed_files:
      - "src/nps_core/codegraph/**"
      - "tests/unit/test_codegraph_incremental.py"
      - "tests/benchmark/test_context_capsule_benchmark.py"
      - "memory/02-decisions/ADR-0011-incremental-codegraph-retrieval-capsule.md"
      - "memory/02-decisions/index.md"
      - "memory/04-tasks/PROJECT-COMPLETION-MATRIX.md"
      - "memory/05-evidence/TASK-008/**"
      - "memory/07-sessions/**"
      - "orchestration/codex/tasks/TASK-008.yaml"
  validation:
    acceptance_criteria:
      - "Incremental AST indexer updates changed files deterministically."
      - "ContextCapsule trims retrieved symbols to fit within max_token_budget."
      - "ContextCache caches symbol lookups with exact hash validation."
      - "Context capsule benchmark demonstrates context token reduction."
      - "All unit tests pass and regression suite remains green."
